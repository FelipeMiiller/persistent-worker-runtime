name: First commit message adheres to guidelines

# Validates the first commit message in a PR against Conventional Commits
# (type(scope): subject) using `@commitlint/cli` + `@commitlint/config-conventional`.
#
# History: this workflow previously used `core-validate-commit` from the
# Node.js core project, which enforced Node.js-specific rules (DCO
# `Signed-off-by` trailer + Node.js-internal subsystems like `async_hooks`,
# `buffer`, `crypto`). Those don't apply to this personal project — replaced
# 2026-09-23 with the standard Conventional Commits validator.
#
# Usage:
#   npx --yes @commitlint/cli --config commitlint.config.js

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: lts/*

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-commit-message:
    name: lint-commit-message
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check out PR head
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      # commitlint needs both `@commitlint/cli` and the conventional preset
      # `@commitlint/config-conventional` resolvable on disk. npx --yes with
      # --ignore-scripts only pulls the top-level package; the preset is a
      # peer / extends dep, so we install both up front.
      - name: Install commitlint + config-conventional
        run: |
          npm install --no-save --no-audit --no-fund \
            @commitlint/cli@19.6.0 \
            @commitlint/config-conventional@19.6.0

      - name: Validate first commit message
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 1,
            });
            if (!commits || commits.length === 0) {
              throw new Error('No commits found in pull request');
            }
            const commit = commits[0];
            // commitlint reads commit message from the file passed to --edit.
            // In a GitHub Action context we have to materialize the message
            // to disk because the workspace's first-commit subject is not
            // available as process.argv[2] without that flag.
            const fs = require('node:fs');
            const path = require('node:path');
            const tmp = path.join(process.cwd(), `.commitlint-msg-${commit.sha}`);
            fs.writeFileSync(tmp, commit.commit.message);
            const { exitCode, stdout, stderr } = await exec.getExecOutput(
              'npx',
              [
                '--no-install',
                'commitlint',
                '--config', 'commitlint.config.cjs',
                '--edit', tmp,
              ],
              { silent: true, ignoreReturnCode: true },
            );
            try { fs.unlinkSync(tmp); } catch (_) { /* ignore */ }
            if (exitCode !== 0) {
              core.setFailed(stdout || stderr || 'Commit message validation failed');
            } else {
              core.info('First commit message passes Conventional Commits validation');
            }
