name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '.agents/**'
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a new commit is pushed
# (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    # Skip draft PRs but still run on push.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 26 becomes Active LTS on 2026-10-28. It is the line with the
        # newest V8 (14.6) and the most platform churn, so it needs a leg
        # here — a defect that only reproduces on Node 26 would otherwise be
        # found by users on the new LTS, not by this CI.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Environment
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run Examples
        run: npm run examples

      - name: Run Full Concurrency & Performance Benchmarks
        run: npm run benchmark:all

      - name: Verify ESM Package Exports
        run: node --input-type=module -e "import * as mod from './src/index.js'; console.log('Exports verified successfully:', Object.keys(mod));"

  engine-floor:
    name: Engine floor (Node 22.13.0, ubuntu)
    # `package.json` declares `engines.node >= 22.13.0` — the release where
    # `node:sqlite` stopped requiring `--experimental-sqlite`. The matrix
    # above resolves `22.x` to the LATEST 22.x, so the declared floor is
    # never exercised there: a change that silently raises the real minimum
    # would ship while `engines` still claims 22.13.0. This leg pins the
    # floor literally.
    #
    # `npm test` ONLY, on Linux only. This leg exists to prove the floor, not
    # to measure performance: benchmarks on the floor can fail for reasons
    # unrelated to the floor (older V8, different GC heuristics, CI noise)
    # and would turn a signal about the engine contract into noise about
    # throughput. The performance signal stays on the matrix legs above.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: 22.13.0

      - name: Verify Environment
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests (engine floor)
        run: npm test