name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '.agents/**'
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a new commit is pushed
# (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    # Skip draft PRs but still run on push.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Environment
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run Full Concurrency & Performance Benchmarks
        run: npm run benchmark:all

      - name: Verify ESM Package Exports
        run: node --input-type=module -e "import * as mod from './src/index.js'; console.log('Exports verified successfully:', Object.keys(mod));"