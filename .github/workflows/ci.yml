name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Environment
        run: |
          node -v
          npm -v

      - name: Run Native Unit Tests
        run: npm test

      - name: Run Test Coverage Report
        run: npm run test:coverage

      - name: Run Event Loop Lag Benchmark
        run: npm run benchmark

      - name: Verify ESM Package Exports Sanity
        run: node --input-type=module -e "import * as mod from './src/index.js'; console.log('Exports verified successfully:', Object.keys(mod));"
