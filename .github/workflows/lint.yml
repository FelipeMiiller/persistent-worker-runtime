name: Linters

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '.agents/**'
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-js:
    name: Biome lint (CI mode)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Biome CI check (no fix, fails on any issue)
        run: npm run lint:ci